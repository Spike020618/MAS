<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 600px; }

        .voice-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        .voice-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        /* ── 标题 ── */
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 {
            color: #2c3e50; font-size: 26px; margin-bottom: 6px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .subtitle { color: #666; font-size: 15px; }

        /* ── 状态栏 ── */
        .ws-status {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: #888;
            margin-bottom: 20px;
            padding: 8px 14px;
            background: #f8f9fa; border-radius: 8px;
        }
        .ws-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #ccc; flex-shrink: 0;
        }
        .ws-dot.connected { background: #4caf50; }
        .ws-dot.disconnected { background: #f44336; }

        /* ── 麦克风按钮 ── */
        .voice-control-area {
            display: flex; flex-direction: column;
            align-items: center; gap: 20px; margin-bottom: 30px;
        }

        .voice-btn {
            width: 80px; height: 80px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
            font-size: 28px;
        }
        .voice-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(102,126,234,0.6); }
        .voice-btn.recording {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%   { transform: scale(1);    box-shadow: 0 0 0 0   rgba(245,87,108,0.7); }
            70%  { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(245,87,108,0);   }
            100% { transform: scale(1);    box-shadow: 0 0 0 0   rgba(245,87,108,0);   }
        }

        .voice-btn-label { font-size: 14px; color: #666; font-weight: 500; }

        /* ── 识别状态 ── */
        .status-display {
            width: 100%;
            text-align: center; padding: 14px;
            background: #f8f9fa; border-radius: 10px;
            border: 1px solid #e9ecef;
            font-size: 14px; color: #666;
            min-height: 52px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
        }
        .status-display.listening  { background: #e3f2fd; color: #1976d2; border-color: #bbdefb; }
        .status-display.processing { background: #fff3e0; color: #f57c00; border-color: #ffe0b2; }
        .status-display.success    { background: #f0fdf4; color: #16a34a; border-color: #bbf7d0; }
        .status-display.error      { background: #fef2f2; color: #dc2626; border-color: #fecaca; }

        /* ── 结果文本框 ── */
        .result-container { margin-top: 20px; }
        .result-label { font-weight: 600; margin-bottom: 8px; font-size: 14px; color: #2c3e50; }

        .result-textarea {
            width: 100%; min-height: 100px; padding: 14px;
            border: 2px solid #e2e8f0; border-radius: 12px;
            font-size: 15px; line-height: 1.6; resize: vertical;
            font-family: inherit; background: white;
            transition: border-color 0.3s;
        }
        .result-textarea:focus { outline: none; border-color: #667eea; }

        /* ── AI 回复框 ── */
        .reply-box {
            margin-top: 16px; padding: 14px 16px;
            background: #f0f4ff; border-radius: 12px;
            border-left: 4px solid #667eea;
            font-size: 14px; line-height: 1.7; color: #333;
            display: none;
        }
        .reply-box.visible { display: block; }
        .reply-label { font-weight: 600; color: #667eea; margin-bottom: 6px; font-size: 13px; }
        .media-hint { margin-top: 8px; font-size: 12px; color: #888; }

        /* ── 操作按钮 ── */
        .action-buttons { display: flex; gap: 12px; margin-top: 20px; }

        .action-btn {
            flex: 1; padding: 14px; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; font-family: inherit;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .submit-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        .submit-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16,185,129,0.3);
        }

        .clear-btn { background: #f1f5f9; color: #64748b; }
        .clear-btn:hover { background: #e2e8f0; transform: translateY(-2px); }

        /* ── 加载动画 ── */
        .loading-spinner {
            display: inline-block; width: 18px; height: 18px;
            border: 3px solid rgba(255,255,255,0.4);
            border-top: 3px solid #fff; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

        @media (max-width: 640px) {
            .voice-card { padding: 24px; }
            .action-buttons { flex-direction: column; }
            .voice-btn { width: 70px; height: 70px; font-size: 24px; }
        }

        /* Visual refresh only: behavior and element IDs remain unchanged. */
        :root {
            --ink: #172033;
            --muted: #738097;
            --brand: #4f67f6;
            --brand-strong: #3348d8;
            --line: rgba(35,54,86,.11);
        }
        body {
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 2%, rgba(79,103,246,.24), transparent 24rem),
                radial-gradient(circle at 90% 88%, rgba(31,187,215,.18), transparent 26rem),
                linear-gradient(160deg, #edf2ff 0%, #f7f9fd 52%, #e9f7fa 100%);
        }
        .container { max-width: 560px; }
        .voice-card {
            padding: 38px; border: 1px solid rgba(255,255,255,.85); border-radius: 28px;
            background: rgba(255,255,255,.88); box-shadow: 0 30px 90px rgba(31,42,68,.16);
            backdrop-filter: blur(24px) saturate(135%);
        }
        .voice-card::before { height: 5px; background: linear-gradient(90deg, var(--brand), #7283ff, #1ebbd7); }
        .header h1 { color: var(--ink); font-size: 28px; letter-spacing: -.03em; }
        .subtitle { color: var(--muted); }
        .ws-status { border: 1px solid var(--line); border-radius: 12px; background: rgba(244,247,251,.82); }
        .ws-dot { box-shadow: 0 0 0 4px rgba(148,163,184,.12); }
        .ws-dot.connected { box-shadow: 0 0 0 4px rgba(34,197,94,.12); }
        .voice-btn {
            width: 92px; height: 92px; background: linear-gradient(145deg, #6075ff, var(--brand-strong));
            box-shadow: 0 18px 44px rgba(79,103,246,.32); border: 6px solid rgba(255,255,255,.7);
        }
        .voice-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 24px 52px rgba(79,103,246,.38); }
        .status-display { border-color: var(--line); border-radius: 13px; background: rgba(244,247,251,.86); }
        .result-textarea { border: 1px solid var(--line); background: rgba(255,255,255,.76); border-radius: 14px; }
        .result-textarea:focus { border-color: rgba(79,103,246,.48); box-shadow: 0 0 0 4px rgba(79,103,246,.09); }
        .reply-box { border: 1px solid rgba(79,103,246,.11); border-left: 4px solid var(--brand); border-radius: 14px; background: #f0f3ff; }
        .reply-label { color: var(--brand); }
        .action-btn { border-radius: 13px; }
        .submit-btn { background: linear-gradient(135deg, var(--brand), var(--brand-strong)); box-shadow: 0 10px 22px rgba(79,103,246,.2); }
        .submit-btn:hover:not(:disabled) { background: linear-gradient(135deg, #6075ff, #3c50dc); box-shadow: 0 12px 26px rgba(79,103,246,.28); }
        .clear-btn { background: #eef1f6; color: #637087; }
        button:focus-visible, textarea:focus-visible { outline: 3px solid rgba(79,103,246,.25); outline-offset: 3px; }
        @media (max-width: 640px) {
            body { padding: 12px; align-items: flex-start; }
            .voice-card { padding: 28px 20px; border-radius: 22px; }
            .header { margin-bottom: 24px; }
            .header h1 { font-size: 25px; }
            .voice-btn { width: 80px; height: 80px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
<div class="container">
  <div class="voice-card">

    <!-- 标题 -->
    <div class="header">
      <h1>🎤 语音助手</h1>
      <p class="subtitle">说出您想问的任何问题，或搜索影视内容</p>
    </div>

    <!-- WebSocket 连接状态 -->
    <div class="ws-status">
      <div class="ws-dot disconnected" id="wsDot"></div>
      <span id="wsStatusText">正在连接主屏…</span>
    </div>

    <!-- 语音控制 -->
    <div class="voice-control-area">
      <button class="voice-btn" id="voiceBtn" onclick="toggleRecording()">🎤</button>
      <span class="voice-btn-label" id="voiceBtnLabel">点击开始录音</span>
      <div class="status-display ready" id="statusDisplay">
        请点击麦克风，可以聊天、提问，或搜索影视
      </div>
    </div>

    <!-- 识别结果 -->
    <div class="result-container">
      <div class="result-label">📝 识别文字</div>
      <textarea class="result-textarea" id="resultText" placeholder="语音识别结果将显示在此处…"></textarea>
    </div>

    <!-- AI 回复 -->
    <div class="reply-box" id="replyBox">
      <div class="reply-label">🤖 AI 回复</div>
      <div id="replyContent"></div>
      <div class="media-hint" id="mediaHint"></div>
    </div>

    <!-- 操作按钮 -->
    <div class="action-buttons">
      <button class="action-btn submit-btn" id="submitBtn" onclick="submitSearch()" disabled>
        ✉️ 发送
      </button>
      <button class="action-btn clear-btn" onclick="clearAll()">
        🗑 清空
      </button>
    </div>

  </div>
</div>

<script>
// ─────────────────────────────────────────────
// 配置
// ─────────────────────────────────────────────
const BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? 'http://localhost:8000'
  : 'https://www.tvosagent.cn';

// 生产环境：www.tvosagent.cn (nginx 反代，wss 同域)
// 开发环境：localhost:8000 (Django 直连)
const WS_URL = (window.location.protocol === 'https:' ? 'wss:' : 'ws:') +
  '//' + window.location.host +
  '/ws/agent/';

// ─────────────────────────────────────────────
// WebSocket：连接主屏，用于接收广播确认
// ─────────────────────────────────────────────
let ws = null;
let wsConnected = false;

function connectWS() {
  try {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      wsConnected = true;
      document.getElementById('wsDot').className = 'ws-dot connected';
      document.getElementById('wsStatusText').textContent = '已连接主屏 ✅';
    };

    ws.onmessage = (evt) => {
      try {
        const data = JSON.parse(evt.data);
        // voice.html 本身也可以接收广播，这里只做 log
        console.log('📨 WS 收到:', data);
      } catch (e) {}
    };

    ws.onclose = () => {
      wsConnected = false;
      document.getElementById('wsDot').className = 'ws-dot disconnected';
      document.getElementById('wsStatusText').textContent = '与主屏断开，3s 后重连…';
      setTimeout(connectWS, 3000);
    };

    ws.onerror = (e) => console.error('WS 错误:', e);
  } catch (e) {
    console.error('WS 连接失败:', e);
    setTimeout(connectWS, 3000);
  }
}

connectWS();

// ─────────────────────────────────────────────
// 语音识别
// ─────────────────────────────────────────────
let recognition = null;
let isRecording = false;

function initRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    setStatus('⚠️ 浏览器不支持语音识别，请使用 Chrome', 'error');
    document.getElementById('voiceBtn').disabled = true;
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    setStatus('🎤 正在聆听，请说话…', 'listening');
  };

  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    document.getElementById('resultText').value = final || interim;
    if (final) document.getElementById('submitBtn').disabled = false;
  };

  recognition.onend = () => {
    isRecording = false;
    document.getElementById('voiceBtn').classList.remove('recording');
    document.getElementById('voiceBtn').textContent = '🎤';
    document.getElementById('voiceBtnLabel').textContent = '点击开始录音';
    const text = document.getElementById('resultText').value.trim();
    if (text) {
      setStatus('✅ 识别完成，点击「发送」提交', 'success');
      document.getElementById('submitBtn').disabled = false;
    } else {
      setStatus('未识别到语音，请重试', 'error');
    }
  };

  recognition.onerror = (e) => {
    isRecording = false;
    document.getElementById('voiceBtn').classList.remove('recording');
    document.getElementById('voiceBtn').textContent = '🎤';
    document.getElementById('voiceBtnLabel').textContent = '点击开始录音';
    setStatus('识别错误: ' + e.error, 'error');
  };
}

function toggleRecording() {
  if (!recognition) initRecognition();
  if (!recognition) return;

  if (isRecording) {
    recognition.stop();
  } else {
    isRecording = true;
    document.getElementById('voiceBtn').classList.add('recording');
    document.getElementById('voiceBtn').textContent = '⏹';
    document.getElementById('voiceBtnLabel').textContent = '点击停止录音';
    document.getElementById('resultText').value = '';
    document.getElementById('submitBtn').disabled = true;
    hideReply();
    recognition.start();
  }
}

// ─────────────────────────────────────────────
// 搜索提交：HTTP 请求，后端会广播 WS
// ─────────────────────────────────────────────
async function submitSearch() {
  const text = document.getElementById('resultText').value.trim();
  if (!text) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="loading-spinner"></div> 处理中…';
  setStatus('⏳ 正在处理，请稍候…', 'processing');
  hideReply();

  try {
    const url = `${BASE_URL}/agent/voice_page_search?message=${encodeURIComponent(text)}`;
    const resp = await fetch(url, { method: 'GET' });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const data = await resp.json();

    // 显示 AI 回复
    if (data.chat) {
      showReply(data.chat, data.medias ? data.medias.length : 0);

      // 语音朗读回复
      if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance(data.chat);
        utter.lang = 'zh-CN';
        utter.rate = 1.1;
        window.speechSynthesis.speak(utter);
      }
    }

    const isMedia = data.medias && data.medias.length > 0;
    setStatus(isMedia ? '✅ 已完成，主屏影视列表已更新' : '✅ 已收到回复', 'success');
  } catch (err) {
    console.error('搜索失败:', err);
    setStatus('❌ 搜索失败: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '✉️ 发送';
  }
}

// ─────────────────────────────────────────────
// 工具函数
// ─────────────────────────────────────────────
function setStatus(text, type) {
  const el = document.getElementById('statusDisplay');
  el.textContent = text;
  el.className = 'status-display ' + (type || 'ready');
}

function showReply(chat, mediaCount) {
  const box = document.getElementById('replyBox');
  document.getElementById('replyContent').textContent = chat;
  document.getElementById('mediaHint').textContent =
    mediaCount > 0 ? `🎬 已为主屏推荐 ${mediaCount} 部影视` : '';
  box.classList.add('visible');
}

function hideReply() {
  document.getElementById('replyBox').classList.remove('visible');
}

function clearAll() {
  document.getElementById('resultText').value = '';
  document.getElementById('submitBtn').disabled = true;
  hideReply();
  setStatus('请点击麦克风，可以聊天、提问，或搜索影视', 'ready');
}

// 支持回车提交
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.ctrlKey) submitSearch();
});
</script>
</body>
</html>
