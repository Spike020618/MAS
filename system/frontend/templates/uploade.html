<!DOCTYPE html>
<html>
<head>
    <title>多模态智能输入</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3a0ca3;
            --accent-color: #4cc9f0;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --border-radius: 16px;
            --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
            color: var(--dark-color);
            -webkit-font-smoothing: antialiased;
        }
        
        .mobile-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 20px;
            text-align: center;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 1.8rem;
            color: var(--secondary-color);
            margin-bottom: 8px;
            font-weight: 700;
        }
        
        .header p {
            font-size: 0.95rem;
            color: #666;
            max-width: 300px;
            margin: 0 auto;
            line-height: 1.5;
        }
        
        .header-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .content-wrapper {
            flex: 1;
            padding: 0 20px 20px;
            overflow-y: auto;
        }
        
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .input-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 25px 20px;
            box-shadow: var(--box-shadow);
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .section-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: white;
            font-size: 1.3rem;
        }
        
        .section-header h2 {
            font-size: 1.3rem;
            color: var(--dark-color);
            font-weight: 600;
            flex: 1;
        }
        
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 30px 15px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 15px;
            background: #f8f9fa;
        }
        
        .upload-area.active {
            border-color: var(--accent-color);
            background-color: rgba(76, 201, 240, 0.08);
        }
        
        .upload-icon {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 12px;
        }
        
        .upload-text {
            color: #555;
            font-weight: 500;
            margin-bottom: 5px;
            font-size: 1rem;
        }
        
        .upload-subtext {
            color: #888;
            font-size: 0.85rem;
        }
        
        .file-input {
            display: none;
        }
        
        .file-label {
            display: block;
            width: 100%;
            background: var(--primary-color);
            color: white;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            text-align: center;
            font-size: 1rem;
            border: none;
        }
        
        .file-label:active {
            background: var(--secondary-color);
            transform: scale(0.98);
        }
        
        .text-area-container {
            position: relative;
            margin-top: 5px;
        }
        
        .text-area-container textarea {
            width: 100%;
            min-height: 120px;
            padding: 16px;
            border: 1.5px solid #eaeaea;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            transition: var(--transition);
            background: #f8f9fa;
            line-height: 1.5;
        }
        
        .text-area-container textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            background: white;
            box-shadow: 0 0 0 3px rgba(76, 201, 240, 0.1);
        }
        
        .char-count {
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: #888;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.9);
            padding: 2px 8px;
            border-radius: 10px;
        }
        
        .preview-container {
            margin-top: 20px;
            text-align: center;
        }
        
        .preview-container h3 {
            margin-bottom: 15px;
            color: var(--dark-color);
            font-weight: 600;
            font-size: 1.1rem;
            text-align: left;
        }
        
        .image-preview {
            max-width: 100%;
            max-height: 180px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            object-fit: contain;
            background: #f8f9fa;
            padding: 8px;
        }
        
        .no-preview {
            color: #999;
            font-style: italic;
            padding: 25px 15px;
            border: 2px dashed #eee;
            border-radius: 12px;
            font-size: 0.95rem;
        }
        
        .file-info {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #666;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
        }
        
        .submit-section {
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.3);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
        }
        
        .submit-btn:active {
            transform: scale(0.98);
            box-shadow: 0 3px 10px rgba(67, 97, 238, 0.3);
        }
        
        .submit-btn.disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .btn-icon {
            font-size: 1.4rem;
        }
        
        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status-message {
            display: none;
            padding: 12px 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.9rem;
            text-align: center;
        }
        
        .status-success {
            background: rgba(46, 204, 113, 0.1);
            color: #27ae60;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }
        
        .status-error {
            background: rgba(231, 76, 60, 0.1);
            color: #c0392b;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }
        
        /* ===== 搜索结果展示区域 ===== */
        .results-container {
            display: none;
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 25px 20px;
            box-shadow: var(--box-shadow);
        }
        
        .results-container.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .results-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .results-header h2 {
            font-size: 1.3rem;
            color: var(--dark-color);
            font-weight: 600;
        }
        
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .result-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            border-left: 4px solid var(--primary-color);
            transition: var(--transition);
        }
        
        .result-item:hover {
            background: #f0f2f5;
            transform: translateX(4px);
        }
        
        .result-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 8px;
        }
        
        .result-meta {
            font-size: 0.9rem;
            color: #666;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .result-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .result-desc {
            font-size: 0.9rem;
            color: #777;
            line-height: 1.4;
        }
        
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        @media (max-width: 640px) {
            .header, .input-section, .results-container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
            
            .submit-section {
                padding: 15px;
            }
        }
        /* Visual refresh only: form submission and preview logic are untouched. */
        :root {
            --primary-color: #4f67f6;
            --secondary-color: #3348d8;
            --accent-color: #1ebbd7;
            --dark-color: #172033;
            --border-radius: 20px;
            --box-shadow: 0 18px 52px rgba(31,42,68,.11);
        }
        body {
            background:
                radial-gradient(circle at 12% 0%, rgba(79,103,246,.25), transparent 25rem),
                radial-gradient(circle at 92% 88%, rgba(30,187,215,.18), transparent 28rem),
                linear-gradient(160deg, #edf2ff 0%, #f8faff 50%, #ebf8fa 100%);
        }
        .mobile-container { max-width: 720px; }
        .header {
            margin: 14px 16px 20px; padding: 24px 22px; border: 1px solid rgba(255,255,255,.85);
            border-radius: 24px; background: rgba(255,255,255,.88); box-shadow: var(--box-shadow);
            backdrop-filter: blur(22px) saturate(135%);
        }
        .header h1 { color: var(--dark-color); letter-spacing: -.03em; }
        .header p { color: #738097; }
        .content-wrapper { padding: 0 16px 24px; }
        .input-section, .results-container {
            border: 1px solid rgba(255,255,255,.88); background: rgba(255,255,255,.88);
            box-shadow: var(--box-shadow); backdrop-filter: blur(20px);
        }
        .section-icon { background: linear-gradient(145deg, var(--primary-color), var(--secondary-color)); box-shadow: 0 10px 24px rgba(79,103,246,.22); }
        .upload-area { border-color: #ccd4e2; background: #f5f7fb; }
        .upload-area:hover, .upload-area.active { border-color: var(--primary-color); background: #f0f3ff; }
        .file-label { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); box-shadow: 0 10px 24px rgba(79,103,246,.2); }
        .text-area-container textarea { border: 1px solid rgba(35,54,86,.12); background: #f6f8fb; }
        .text-area-container textarea:focus { border-color: rgba(79,103,246,.48); box-shadow: 0 0 0 4px rgba(79,103,246,.09); }
        .submit-section {
            margin: 0 16px 14px; padding: 18px; border: 1px solid rgba(255,255,255,.85);
            border-radius: 22px; background: rgba(255,255,255,.9); box-shadow: var(--box-shadow);
            backdrop-filter: blur(22px);
        }
        .submit-btn { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); box-shadow: 0 12px 26px rgba(79,103,246,.25); }
        .result-item { border: 1px solid rgba(35,54,86,.08); border-left: 4px solid var(--primary-color); background: #f6f8fb; }
        .result-item:hover { background: #f0f3ff; }
        button:focus-visible, textarea:focus-visible, label:focus-visible { outline: 3px solid rgba(79,103,246,.25); outline-offset: 3px; }
        @media (min-width: 680px) {
            .form-container { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
            .results-container { grid-column: 1 / -1; }
        }
        @media (max-width: 480px) {
            .header { margin: 8px 10px 16px; padding: 20px 16px; }
            .header h1 { font-size: 1.55rem; }
            .content-wrapper { padding-inline: 10px; }
            .input-section { padding: 20px 16px; }
            .submit-section { margin-inline: 10px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- 顶部标题栏 -->
        <div class="header">
            <div class="header-icon">🤖</div>
            <h1>智能多模态输入</h1>
            <p>上传图片并输入文本进行智能处理</p>
        </div>
        
        <!-- 主要内容区域 -->
        <div class="content-wrapper">
            <div class="form-container">
                <!-- 图片上传区域 -->
                <div class="input-section">
                    <div class="section-header">
                        <div class="section-icon">📷</div>
                        <h2>图片上传</h2>
                    </div>
                    
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📁</div>
                        <div class="upload-text">点击或拖拽上传图片</div>
                        <div class="upload-subtext">支持 JPG、PNG、GIF 格式</div>
                    </div>
                    
                    <input type="file" id="imageUpload" accept="image/*" class="file-input">
                    <label for="imageUpload" class="file-label">选择图片</label>
                    
                    <div class="preview-container">
                        <h3>图片预览</h3>
                        <div id="previewContent">
                            <div class="no-preview">暂无图片，请选择或拍摄照片</div>
                        </div>
                    </div>
                </div>

                <!-- 文本输入区域 -->
                <div class="input-section">
                    <div class="section-header">
                        <div class="section-icon">📝</div>
                        <h2>文本描述</h2>
                    </div>
                    
                    <div class="text-area-container">
                        <textarea id="textInput" placeholder="请输入图片描述或问题..."></textarea>
                        <div class="char-count">
                            <span id="charCount">0</span> / 500
                        </div>
                    </div>
                </div>
                
                <!-- 搜索结果展示区域 -->
                <div id="resultsContainer" class="results-container">
                    <div class="results-header">
                        <div class="section-icon" style="margin-bottom: 0; margin-right: 15px;">🎬</div>
                        <h2>推荐结果</h2>
                    </div>
                    <div id="resultsList" class="results-list"></div>
                </div>
            </div>
            
            <!-- 状态提示 -->
            <div id="statusMessage" class="status-message"></div>
        </div>
        
        <!-- 底部操作栏 -->
        <div class="submit-section safe-area-bottom">
            <button id="submitBtn" class="submit-btn">
                <span class="btn-icon">🚀</span>
                <span id="submitText">提交处理</span>
                <div class="loading" id="loadingSpinner"></div>
            </button>
        </div>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const uploadArea = document.getElementById('uploadArea');
        const previewContent = document.getElementById('previewContent');
        const textInput = document.getElementById('textInput');
        const charCount = document.getElementById('charCount');
        const submitBtn = document.getElementById('submitBtn');
        const submitText = document.getElementById('submitText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const statusMessage = document.getElementById('statusMessage');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsList = document.getElementById('resultsList');
        
        uploadArea.addEventListener('click', () => {
            imageUpload.click();
        });
        
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                if (!file.type.match('image.*')) {
                    showStatus('请选择图片文件（JPG、PNG、GIF）', 'error');
                    return;
                }
                
                if (file.size > 10 * 1024 * 1024) {
                    showStatus('图片大小不能超过10MB', 'error');
                    return;
                }
                
                const reader = new FileReader();
                reader.onloadstart = function() {
                    previewContent.innerHTML = '<div class="no-preview">加载中...</div>';
                };
                
                reader.onload = function(event) {
                    previewContent.innerHTML = `
                        <img src="${event.target.result}" alt="图片预览" class="image-preview">
                        <div class="file-info">
                            ${file.name} (${(file.size / 1024).toFixed(1)} KB)
                        </div>
                    `;
                    showStatus('图片上传成功！', 'success');
                };
                
                reader.onerror = function() {
                    showStatus('图片加载失败，请重试', 'error');
                };
                
                reader.readAsDataURL(file);
            }
        });
        
        textInput.addEventListener('input', function() {
            const count = this.value.length;
            charCount.textContent = count;
            
            if (count > 500) {
                charCount.style.color = '#e74c3c';
                this.value = this.value.substring(0, 500);
                charCount.textContent = '500';
                showStatus('字数已达上限（500字）', 'error');
            } else if (count > 450) {
                charCount.style.color = '#f39c12';
            } else {
                charCount.style.color = '#888';
            }
        });
        
        submitBtn.addEventListener('click', async () => {
            await submitForm();
        });
        
        async function submitForm() {
            const text = textInput.value.trim();
            const imageFile = imageUpload.files[0];
            
            if (!text && !imageFile) {
                showStatus('请至少输入文本或上传图片', 'error');
                return;
            }
            
            submitBtn.classList.add('disabled');
            submitText.textContent = '处理中...';
            loadingSpinner.style.display = 'block';
            statusMessage.style.display = 'none';
            resultsContainer.classList.remove('show');
            
            try {
                const formData = new FormData();
                formData.append('text', text);
                if (imageFile) {
                    formData.append('image', imageFile);
                }
                
                // 与当前二维码页面同源，兼容localhost、127.0.0.1和局域网IP。
                const apiUrl = `${window.location.origin}/agent/upload`;
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP错误: ${response.status}`);
                }
                
                const result = await response.json();
                if (result.status === 'success') {
                    showStatus('分析成功！', 'success');
                    displayResults(result);
                    clearForm();
                } else {
                    showStatus('分析失败: ' + (result.message || '未知错误'), 'error');
                }
            } catch (error) {
                console.error('提交错误:', error);
                showStatus('错误: ' + error.message, 'error');
            } finally {
                submitBtn.classList.remove('disabled');
                submitText.textContent = '提交处理';
                loadingSpinner.style.display = 'none';
            }
        }
        
        function displayResults(data) {
            resultsList.innerHTML = '';
            
            if (data.medias_info && data.medias_info.length > 0) {
                data.medias_info.forEach((movie, index) => {
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    
                    let metaHtml = '';
                    if (movie.director && movie.director.trim()) metaHtml += `<div class="result-meta-item">👤 ${movie.director}</div>`;
                    if (movie.year) metaHtml += `<div class="result-meta-item">📅 ${movie.year}年</div>`;
                    if (movie.rating) metaHtml += `<div class="result-meta-item">⭐ ${movie.rating}分</div>`;
                    if (movie.duration) metaHtml += `<div class="result-meta-item">⏱️ ${movie.duration}</div>`;
                    if (movie.views) metaHtml += `<div class="result-meta-item">👁️ ${movie.views}</div>`;
                    
                    item.innerHTML = `
                        <div class="result-title">${index + 1}. ${movie.name || '未知'}</div>
                        <div class="result-meta">${metaHtml}</div>
                        ${movie.description ? `<div class="result-desc">${movie.description}</div>` : ''}
                    `;
                    resultsList.appendChild(item);
                });
                
                resultsContainer.classList.add('show');
            }
        }
        
        function clearForm() {
            textInput.value = '';
            previewContent.innerHTML = '<div class="no-preview">暂无图片，请选择或拍摄照片</div>';
            imageUpload.value = '';
            charCount.textContent = '0';
        }
        
        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message';
            statusMessage.classList.add(`status-${type}`);
            statusMessage.style.display = 'block';
            
            setTimeout(() => {
                if (type === 'success') {
                    statusMessage.style.display = 'none';
                }
            }, 3000);
        }
        
        charCount.textContent = textInput.value.length;
        
        window.addEventListener('beforeunload', function (e) {
            const text = textInput.value.trim();
            if (text || imageUpload.files[0]) {
                e.preventDefault();
                e.returnValue = '您有未提交的内容，确定要离开吗？';
            }
        });
    </script>
</body>
</html>
