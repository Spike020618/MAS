<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>影视检索与证据工作台</title><style>
:root{font-family:system-ui,"PingFang SC",sans-serif;color:#24364b;background:#f5f7fa}*{box-sizing:border-box}body{max-width:1340px;margin:auto;padding:36px 24px}h1{font-size:30px;margin:0 0 8px}h2{font-size:18px}p{line-height:1.7}.muted{color:#69798b}.tabs{display:flex;gap:8px;margin:25px 0}button,input,select{font:inherit;padding:11px;border:1px solid #cfd9e3;border-radius:5px;background:white}button{cursor:pointer;color:#355f89}button.active,button[type=submit]{background:#355f89;color:white}.panel{background:white;padding:22px;border:1px solid #dae2eb;border-radius:8px;margin-bottom:18px}.form{display:flex;gap:10px;flex-wrap:wrap}#query{flex:1;min-width:260px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.card{border:1px solid #dbe4ec;border-radius:6px;padding:17px}.tag{font-size:12px;color:#34756d;background:#edf6f4;padding:4px 7px;display:inline-block;margin-right:6px}.evidence{border-left:3px solid #8aa5bd;margin:12px 0;padding:4px 12px;background:#f7f9fb;line-height:1.7}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.hidden{display:none}.event{padding:12px 0;border-bottom:1px solid #edf0f4}#message{min-height:24px;color:#69798b}.warning{color:#996026}@media(max-width:650px){body{padding:20px 12px}.form>*{width:100%}}</style>
<header><h1>影视检索与证据工作台</h1><p class="muted">查看原生影片候选、可追溯依据与角色判断，以及完整封存的研究轨迹。</p></header>
<nav class="tabs"><button id="live-tab" class="active">影视检索</button><button id="replay-tab">研究案例回放</button><a href="/">返回原工作台</a></nav>
<section id="live" class="panel"><h2>按需求检索影片</h2><form id="search" class="form"><input id="query" required placeholder="例如：推荐几部温暖的科幻电影"><input id="minyear" type="number" min="1888" max="2100" placeholder="最早年份"><input id="required" placeholder="必选类型，例如 科幻"><input id="excluded" placeholder="排除类型，例如 恐怖"><button type="submit">检索并审议</button></form><p class="muted">当前在线链路使用已有角色审议与约束门控；集合价值博弈通过独立实验评价，封存后可在回放页检查。</p></section>
<section id="replay" class="panel hidden"><h2>读取已封存研究案例</h2><div class="form"><select id="stage"><option value="main">StrategyQA / ReDial</option><option value="benchmark">HotpotQA</option></select><input id="case-index" type="number" min="0" value="0" aria-label="案例序号"><button id="load-case">加载案例</button></div><p id="inventory" class="muted"></p></section><p id="message" role="status" aria-live="polite">等待操作。</p><main id="result"></main>
<script>
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tabs(replay){$('#live').classList.toggle('hidden',replay);$('#replay').classList.toggle('hidden',!replay);$('#live-tab').classList.toggle('active',!replay);$('#replay-tab').classList.toggle('active',replay);$('#result').innerHTML=''}
$('#live-tab').onclick=()=>tabs(false);$('#replay-tab').onclick=async()=>{tabs(true);try{const r=await fetch('/v1/research/status'),d=await r.json();$('#inventory').textContent=d.stages.map(s=>s.title+'：'+(s.sealed?s.cases+'个已封存案例':'尚未完整封存')).join('；')}catch(e){$('#message').textContent='无法读取批次状态'}};
function evidence(items){return(items||[]).map(e=>`<div class="evidence"><span class="tag">${esc(e.source||e.source_kind||'原文片段')}</span><p>${esc(e.claim||e.text)}</p><small>${esc(e.reference||e.source_id||'')}</small>${e.verified===true?'<small> · 标记为已核查</small>':''}</div>`).join('')||'<p class="muted">暂无引用依据。</p>'}
$('#search').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;$('#message').textContent='正在检索与角色审议…';try{const payload={query:$('#query').value,top_k:5,min_year:$('#minyear').value?Number($('#minyear').value):null,required_genres:$('#required').value.split(/[,，]/).filter(Boolean),excluded_genres:$('#excluded').value.split(/[,，]/).filter(Boolean)};const r=await fetch('/v1/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)throw Error(d.error||d.detail||'请求失败');$('#result').innerHTML='<section class="grid">'+(d.decisions||[]).map((x,i)=>{const c=x.candidate;return `<article class="panel"><span class="tag">候选 ${esc(c.movie_id)}</span><h2>${i+1}. ${esc(c.title)}</h2><p>${esc(c.year)} · ${esc((c.genres||[]).join(' / '))}</p><p>综合分 ${Number(x.score).toFixed(3)}</p><details><summary>来源与依据</summary>${evidence(x.accepted_evidence)}</details><details><summary>角色判断与未决分歧</summary>${(d.trace.reports||[]).filter(t=>t.candidate_id===c.movie_id).map(t=>`<div class="evidence"><b>${esc(t.role)} / ${esc(t.verdict)}</b><p>${esc(t.assumption)}</p><p>${esc(t.inference)}</p></div>`).join('')}<p>${esc((x.residual_dissent||[]).join('；'))}</p></details></article>`}).join('')+'</section>';$('#message').textContent='返回 '+d.decisions.length+' 个结果；事实依据与偏好推断分别查看。'}catch(err){$('#message').textContent=err.message}finally{button.disabled=false}};
$('#load-case').onclick=async()=>{try{const stage=$('#stage').value,index=$('#case-index').value;const r=await fetch('/v1/research/case?stage='+encodeURIComponent(stage)+'&index='+encodeURIComponent(index)),d=await r.json();if(!r.ok)throw Error(d.error||'读取失败');const t=d.task;$('#result').innerHTML=`<section class="panel"><h2>${esc(t.prompt)}</h2><p class="muted">${esc(t.id)} · 回放不读取评价标签</p></section>`+Object.entries(d.case.methods||{}).map(([name,arm])=>`<section class="panel"><h2>${esc(name)}</h2><p>初始决策：${esc(JSON.stringify(arm.initial_decision))}</p><p>最终决策：${esc(JSON.stringify(arm.decision))}</p>${(arm.events||[]).filter(e=>e.phase==='review').map(e=>`<div class="event"><b>${e.valid?'合同有效':'合同失败'}</b> · ${esc(e.report?.verdict||'未返回判断')}<p>${esc(e.report?.rationale||e.error)}</p>${evidence(e.citations)}<p>前：${esc(JSON.stringify(e.before))}<br>后：${esc(JSON.stringify(e.after))}</p></div>`).join('')}<details><summary>预算分配与偏离记录</summary><pre>${esc(JSON.stringify(arm.allocations||[],null,2))}</pre></details></section>`).join('');$('#message').textContent='已加载封存案例。该页面展示过程，不把一致或合同通过当作正确性。'}catch(err){$('#message').textContent=err.message}};
</script></html>
