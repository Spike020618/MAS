<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
 <dir>/Library/Fonts</dir>
 <dir>/System/Library/Fonts/Supplemental</dir>
 <cachedir>/private/tmp/mas-midterm-font-cache</cachedir>
 <match target="pattern"><test name="family"><string>宋体</string></test><edit name="family" mode="prepend"><string>Arial Unicode MS</string></edit></match>
 <match target="pattern"><test name="family"><string>黑体</string></test><edit name="family" mode="prepend"><string>Arial Unicode MS</string></edit></match>
</fontconfig>
