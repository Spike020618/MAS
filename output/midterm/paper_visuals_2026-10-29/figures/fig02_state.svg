<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="475" viewBox="0 0 1280 475" role="img" aria-labelledby="title desc"><title id="title">主张证据关联与公共状态表示</title><desc id="desc">来源范围区分当前任务、历史用户与目录事实。引用将资料片段关联到主张，核查关系与当前决策分别保存；历史记录保留被反驳主张，不将其重新作为活动依据。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#77808d" stroke-width="1.4"/></marker></defs><rect width="1280" height="475" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><rect x="20" y="20" width="360" height="430" rx="9" fill="white" stroke="#507ea7" stroke-width="1.5"/><text x="38" y="54" font-size="25" text-anchor="start" fill="#222831" font-weight="600">(a) 来源与范围</text><rect x="410" y="20" width="460" height="430" rx="9" fill="white" stroke="#8b7daf" stroke-width="1.5"/><text x="428" y="54" font-size="25" text-anchor="start" fill="#222831" font-weight="600">(b) 主张—证据关系</text><rect x="900" y="20" width="360" height="430" rx="9" fill="white" stroke="#5d998a" stroke-width="1.5"/><text x="918" y="54" font-size="25" text-anchor="start" fill="#222831" font-weight="600">(c) 公共状态</text><g transform="translate(55,83) scale(0.7)"><rect x="0" y="0" width="58" height="72" rx="3" fill="white" stroke="#507ea7" stroke-width="1.5"/><path d="M37 0 V18 H58" fill="none" stroke="#507ea7" stroke-width="2.2"/><path d="M10 30 H46" fill="none" stroke="#507ea7" stroke-width="1.6"/><path d="M10 41 H46" fill="none" stroke="#507ea7" stroke-width="1.6"/><path d="M10 52 H46" fill="none" stroke="#507ea7" stroke-width="1.6"/><text x="29" y="92" font-size="23" text-anchor="middle" fill="#507ea7" font-weight="400" font-style="italic" font-family="Times New Roman,serif">e₁</text></g><text x="210" y="119" font-size="24" text-anchor="middle" fill="#222831" font-weight="400">当前任务</text><rect x="130" y="145" width="160" height="29" rx="14" fill="white" stroke="#507ea7" stroke-width="1.5"/><text x="210" y="166" font-size="19"