<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="550" viewBox="0 0 1280 550" role="img" aria-labelledby="title desc"><title id="title">预算约束下的在线执行闭环</title><desc id="desc">每次只落实一个核查，提交后按剩余预算回到目标定位与估值。停止后读取最终共同决策，未知或无效输出按统一执行规则记录。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#77808d" stroke-width="1.4"/></marker></defs><rect width="1280" height="550" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><circle cx="180" cy="125" r="54" fill="white" stroke="#507ea7" stroke-width="1.8"/><text x="180" y="134" font-size="27" text-anchor="middle" fill="#507ea7" font-weight="600">定位</text><circle cx="640" cy="125" r="54" fill="white" stroke="#8b7daf" stroke-width="1.8"/><text x="640" y="134" font-size="27" text-anchor="middle" fill="#8b7daf" font-weight="600">估值</text><circle cx="1100" cy="125" r="54" fill="white" stroke="#ce9356" stroke-width="1.8"/><text x="1100" y="134" font-size="27" text-anchor="middle" fill="#ce9356" font-weight="600">分配</text><circle cx="1100" cy="355" r="54" fill="white" stroke="#ce9356" stroke-width="1.8"/><text x="1100" y="364" font-size="27" text-anchor="middle" fill="#ce9356" font-weight="600">核查</text><circle cx="640" cy="355" r="54" fill="white" stroke="#5d998a" stroke-width="1.8"/><text x="640" y="364" font-size="27" text-anchor="middle" fill="#5d998a" font-weight="600">提交</text><circle cx="180" cy="355" r="54" fill="white" stroke="#507ea7" stroke-width="1.8"/><text x="180" y="364" font-size="27" text-anchor="middle" fill="#507ea7" font-weight="600">读出</text><path d="M240 125 L580 125" fill="none" stroke="#77808d" stroke-width="2.2" marker-end="url(#arr)"/><path d="M700 125 L1040 125" fill="none" stroke="#77808d" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1100 185 L1100 295" fill="none" stroke="#77808d" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1040 355 L700 355" fill="none" stroke="#77808d" stroke-width="2.2" marker-end="url(#arr)"/><path d="M580 355 L240 355" fill="none" stroke="#77808d" stroke-width="2.2" marker-end="url(#arr)"/><text x="180" y="215" font-size="26" text-anchor="middle" fill="#222831" font-weight="400" font-style="italic" font-family="Times New Roman,serif">cₖ</text><text x="640" y="215" font-size="26" text-anchor="middle" fill="#222831" font-weight="400" font-style="italic" font-family="Times New Roman,serif">ĝᵢ · ĥᵢ</text><text x="1100" y="215" font-size="26" text-anchor="middle" fill="#222831" font-weight="400" font-style="italic" font-family="Times New Roman,serif">a*</text><text x="1100" y="445" font-size="24" text-anchor="middle" fill="#222831" font-weight="400" font-style="italic" font-family="Times New Roman,serif">r · refs · patch</text><text x="640" y="445" font-size="26" text-anchor="middle" fill="#222831" font-weight="400" font-style="italic" font-family="Times New Roman,serif">sₜ → sₜ₊₁</text><text x="180" y="445" font-size="26" text-anchor="middle" fill="#222831" font-weight="400" font-style="italic" font-family="Times New Roman,serif">d_T</text><path d="M640 295 V260 H180 V184" fill="none" stroke="#5d998a" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arr)"/><text x="425" y="247" font-size="22" text-anchor="middle" fill="#5d998a" font-weight="400">剩余预算 &gt; 0</text><text x="640" y="512" font-size="23" text-anchor="middle" fill="#77808d" font-weight="400">停止：预算耗尽 / 无合法行动 / 不再追加</text></g></svg>