<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="475" viewBox="0 0 1280 475" role="img" aria-labelledby="title desc"><title id="title">集合价值与边际贡献协调</title><desc id="desc">证据并集消除重复计值，联合项表达互补或干扰。成员在共享资源下替换动作，边际效用变化等于共同潜势变化；终止后检查最大可行偏离。该图未表示代理均衡必然提高真实任务质量。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#77808d" stroke-width="1.4"/></marker></defs><rect width="1280" height="475" fill="white"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><rect x="20" y="20" width="400" height="430" rx="9" fill="white" stroke="#507ea7" stroke-width="1.5"/><text x="38" y="54" font-size="25" text-anchor="start" fill="#222831" font-weight="600">(a) 证据并集</text><rect x="450" y="20" width="370" height="430" rx="9" fill="white" stroke="#ce9356" stroke-width="1.5"/><text x="468" y="54" font-size="25" text-anchor="start" fill="#222831" font-weight="600">(b) 行动分配</text><rect x="850" y="20" width="410" height="430" rx="9" fill="white" stroke="#5d998a" stroke-width="1.5"/><text x="868" y="54" font-size="25" text-anchor="start" fill="#222831" font-weight="600">(c) 可行最佳响应</text><ellipse cx="175" cy="220" rx="105" ry="112" fill="#eaf0f7" stroke="#507ea7" stroke-width="2"/><ellipse cx="280" cy="220" rx="105" ry="112" fill="#f6eee5" fill-opacity=".75" stroke="#ce9356" stroke-width="2"/><text x="130" y="225" font-size="29" text-anchor="middle" fill="#507ea7" font-weight="400" font-style="italic" font-family="Times New Roman,serif">e₁</text><text x="227" y="225" font-size="29" text-anchor="middle" fill="#8b7daf" font-weight="400" font-style="italic" font-family="Times New Roman,serif">e₂</text><text x="325" y="225" font-size="29" text-anchor="middle" fill="#ce9356" font-weight="400" font-style="italic" font-family="Times New Roman,serif">e₃</text><text x="160" y="365" font-size="24" text-anchor="middle" fill="#222831" font-weight="400">重复来源计一次</text><text x="300" y="395" font-size="25"