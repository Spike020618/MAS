<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">封存、评分与只读回放的数据边界</title><desc id="desc">生成、评价与展示分离，回放不启动新的模型调用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#65758a" stroke-width="1.4"/></marker></defs><rect width="1200" height="570" fill="white"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="40" text-anchor="start" fill="#203047" font-size="26" font-weight="600"><tspan x="30" dy="0">执行、评价与回放边界</tspan></text><rect x="30" y="100" width="320" height="170" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="190.0" y="139" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="190.0" dy="0">生成与执行记录</tspan></text><text x="190.0" y="178" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="190.0" dy="0">任务 / 状态 / 资料指纹</tspan><tspan x="190.0" dy="30.45">原始响应先落盘</tspan><tspan x="190.0" dy="30.45">合法补丁原子提交</tspan></text><rect x="440" y="100" width="320" height="170" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="600.0" y="139" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="600.0" dy="0">完整封存</tspan></text><text x="600.0" y="178" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="600.0" dy="0">核对任务身份与案例哈希</tspan><tspan x="600.0" dy="30.45">完成前不进入研究回放</tspan><tspan x="600.0" dy="30.45">保留无效与未知请求</tspan></text><rect x="850" y="100" width="320" height="170" rx="9" fill="#fbf5ed" stroke="#b87536" stroke-width="1.8"/><text x="1010.0" y="139" text-anchor="middle" fill="#b87536" font-size="25" font-weight="600"><tspan x="1010.0" dy="0">离线评分</tspan></text><text x="1010.0" y="178" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="1010.0" dy="0">封存后读取评价标签</tspan><tspan x="1010.0" dy="30.45">配对统计与成本审计</tspan><tspan x="1010.0" dy="30.45">不反馈控制本题生成</tspan></text><path d="M350 185 H435" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M760 185 H845" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="440" y="370" width="730" height="150" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="805.0" y="409" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="805.0" dy="0">只读研究回放</tspan></text><text x="805.0" y="448" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="805.0" dy="0">固定阶段与索引 → 身份核对 → 初始/最终状态、引用与更新</tspan><tspan x="805.0" dy="30.45">不返回密钥、评价答案或原始请求槽位</tspan></text><path d="M600 270 V365" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="370" width="320" height="150" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="190.0" y="409" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="190.0" dy="0">应用检索工作台</tspan></text><text x="190.0" y="448" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="190.0" dy="0">新请求走在线工作流</tspan><tspan x="190.0" dy="30.45">历史案例只读展示</tspan><tspan x="190.0" dy="30.45">两类日志分别归档</tspan></text><path d="M350 445 H435" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="8 6"/></g></svg>