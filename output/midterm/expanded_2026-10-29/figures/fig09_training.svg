<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">匹配四分支收益学习流程</title><desc id="desc">控制再次思考收益，分别学习单份增量与二阶交互。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#65758a" stroke-width="1.4"/></marker></defs><rect width="1200" height="650" fill="white"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="40" text-anchor="start" fill="#203047" font-size="26" font-weight="600"><tspan x="30" dy="0">同状态匹配采集</tspan></text><rect x="30" y="90" width="1140" height="110" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="600.0" y="129" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="600.0" dy="0">共同初始条件</tspan></text><text x="600.0" y="168" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="600.0" dy="0">相同任务、报告、目标主张、核查者、模型与局部修改合同</tspan></text><rect x="30" y="275" width="255" height="140" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="157.5" y="314" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="157.5" dy="0">空集</tspan></text><text x="157.5" y="353" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="157.5" dy="0">原有资料再思考</tspan><tspan x="157.5" dy="30.45">质量 Q(∅)</tspan></text><path d="M157 200 V270" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="325" y="275" width="255" height="140" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="452.5" y="314" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="452.5" dy="0">单份 A</tspan></text><text x="452.5" y="353" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="452.5" dy="0">增加资料 A</tspan><tspan x="452.5" dy="30.45">质量 Q(A)</tspan></text><path d="M452 200 V270" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="620" y="275" width="255" height="140" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="747.5" y="314" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="747.5" dy="0">单份 B</tspan></text><text x="747.5" y="353" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="747.5" dy="0">增加资料 B</tspan><tspan x="747.5" dy="30.45">质量 Q(B)</tspan></text><path d="M747 200 V270" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="915" y="275" width="255" height="140" rx="9" fill="#fbf5ed" stroke="#b87536" stroke-width="1.8"/><text x="1042.5" y="314" text-anchor="middle" fill="#b87536" font-size="25" font-weight="600"><tspan x="1042.5" dy="0">联合 AB</tspan></text><text x="1042.5" y="353" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="1042.5" dy="0">同时阅读 A 与 B</tspan><tspan x="1042.5" dy="30.45">质量 Q(AB)</tspan></text><path d="M1042 200 V270" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="490" width="1140" height="120" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="600.0" y="529" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="600.0" dy="0">生成完成 → 封存 → 读取标签 → 构造增量与交互</tspan></text><text x="600.0" y="568" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="600.0" dy="0">按原题或原会话划分训练与校准；四条分支不拆散进入不同分组</tspan></text><path d="M157 415 V485" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M452 415 V485" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M747 415 V485" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1042 415 V485" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/></g></svg>