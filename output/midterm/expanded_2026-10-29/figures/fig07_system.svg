<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">影视搜索推荐系统与机制接入边界</title><desc id="desc">系统主体已实现，新的集合价值机制通过独立实验验证后接入在线应用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#65758a" stroke-width="1.4"/></marker></defs><rect width="1200" height="730" fill="white"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="40" text-anchor="start" fill="#203047" font-size="26" font-weight="600"><tspan x="30" dy="0">影视搜索推荐系统与研究机制接口</tspan></text><rect x="30" y="90" width="260" height="150" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="160.0" y="129" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="160.0" dy="0">交互与接口层</tspan></text><text x="160.0" y="168" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="160.0" dy="0">React 搜索与结果页面</tspan><tspan x="160.0" dy="30.45">结构化请求与审计视图</tspan></text><rect x="350" y="90" width="350" height="150" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="525.0" y="129" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="525.0" dy="0">请求时规划与候选层</tspan></text><text x="525.0" y="168" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="525.0" dy="0">当前请求、约束与偏好</tspan><tspan x="525.0" dy="30.45">真实影片目录与冻结短名单</tspan></text><rect x="760" y="90" width="410" height="150" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="965.0" y="129" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="965.0" dy="0">应用工作流</tspan></text><text x="965.0" y="168" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="965.0" dy="0">并行逻辑角色与确定性约束门控</tspan><tspan x="965.0" dy="30.45">证据 / 信誉聚合与 Top-K</tspan></text><path d="M290 165 H345" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M700 165 H755" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="325" width="1140" height="130" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="600.0" y="364" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="600.0" dy="0">执行追踪与资源记录</tspan></text><text x="600.0" y="403" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="600.0" dy="0">请求ID · 初始报告 · 来源 · 核查行动 · 决策变化 · Token与异常</tspan></text><path d="M965 240 V320" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M160 240 V320" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="350" y="520" width="820" height="120" rx="9" fill="#fbf5ed" stroke="#b87536" stroke-width="1.8"/><text x="760.0" y="559" text-anchor="middle" fill="#b87536" font-size="25" font-weight="600"><tspan x="760.0" dy="0">集合价值研究机制</tspan></text><text x="760.0" y="598" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="760.0" dy="0">独立实验运行器已接线；在线应用适配与回归为后续工作</tspan></text><path d="M760 520 V460" fill="none" stroke="#b87536" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="180" y="565" text-anchor="middle" fill="#65758a" font-size="19" font-weight="400"><tspan x="180" dy="0">统一报告与行动契约</tspan></text><text x="600" y="690" text-anchor="middle" fill="#65758a" font-size="19" font-weight="400"><tspan x="600" dy="0">应用原型采用统一调度；逻辑Agent分工不等于已完成物理去中心化部署。</tspan></text></g></svg>