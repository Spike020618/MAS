<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">证据贡献博弈共识机制整体架构</title><desc id="desc">共同资料池、三成员分工、公共状态、价值估计、博弈和局部更新构成闭环。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#65758a" stroke-width="1.4"/></marker></defs><rect width="1200" height="700" fill="white"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="40" text-anchor="start" fill="#203047" font-size="26" font-weight="600"><tspan x="30" dy="0">整体架构</tspan></text><rect x="25" y="90" width="210" height="190" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="130.0" y="129" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="130.0" dy="0">任务与共同资料池</tspan></text><text x="130.0" y="168" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="130.0" dy="0">问题或对话前缀</tspan><tspan x="130.0" dy="30.45">合法候选与原文</tspan><tspan x="130.0" dy="30.45">同信息访问权限</tspan></text><rect x="285" y="65" width="230" height="95" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="400.0" y="104" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="400.0" dy="0">Agent 1</tspan></text><text x="400.0" y="143" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="400.0" dy="0">局部材料与初始报告</tspan></text><rect x="285" y="180" width="230" height="95" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="400.0" y="219" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="400.0" dy="0">Agent 2</tspan></text><text x="400.0" y="258" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="400.0" dy="0">局部材料与初始报告</tspan></text><rect x="285" y="295" width="230" height="95" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="400.0" y="334" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="400.0" dy="0">Agent 3</tspan></text><text x="400.0" y="373" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="400.0" dy="0">局部材料与初始报告</tspan></text><path d="M235 185 H260 V112 H280" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M260 185 V227 H280" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M260 227 V342 H280" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="570" y="130" width="245" height="200" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="692.5" y="169" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="692.5" dy="0">公共证据状态</tspan></text><text x="692.5" y="208" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="692.5" dy="0">活动主张与当前决策</tspan><tspan x="692.5" dy="30.45">引用片段与适用范围</tspan><tspan x="692.5" dy="30.45">版本和更新历史</tspan></text><path d="M515 112 H540 V230 H565" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M515 227 H540 V230 H565" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M515 342 H540 V230 H565" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="870" y="75" width="305" height="140" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="1022.5" y="114" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="1022.5" dy="0">成员条件价值估计</tspan></text><text x="1022.5" y="153" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="1022.5" dy="0">单份收益 g 与交互 h</tspan><tspan x="1022.5" dy="30.45">预测决策增量与成本</tspan></text><rect x="870" y="265" width="305" height="145" rx="9" fill="#fbf5ed" stroke="#b87536" stroke-width="1.8"/><text x="1022.5" y="304" text-anchor="middle" fill="#b87536" font-size="25" font-weight="600"><tspan x="1022.5" dy="0">边际贡献博弈</tspan></text><text x="1022.5" y="343" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="1022.5" dy="0">可行最佳响应与偏离检查</tspan><tspan x="1022.5" dy="30.45">同目标中央与贪心对照</tspan></text><path d="M815 180 H840 V145 H865" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1020 215 V260" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="570" y="465" width="605" height="130" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="872.5" y="504" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="872.5" dy="0">指定成员核查与局部提交</tspan></text><text x="872.5" y="543" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="872.5" dy="0">原文片段引用 → 操作校验 → 原生答案或一处排序交换</tspan></text><path d="M1020 410 V460" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M570 530 H540 V330 H575" fill="none" stroke="#32827b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="370" y="460" text-anchor="middle" fill="#65758a" font-size="19" font-weight="400"><tspan x="370" dy="0">每次执行后更新状态并重新估值</tspan></text><rect x="25" y="465" width="450" height="130" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="250.0" y="504" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="250.0" dy="0">离线匹配训练</tspan></text><text x="250.0" y="543" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="250.0" dy="0">同状态空集、单份与联合分支</tspan><tspan x="250.0" dy="30.45">生成封存后评分；冻结收益模型</tspan></text><path d="M475 565 H520 V630 H1190 V145 H1178" fill="none" stroke="#426b9a" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="595" y="665" text-anchor="middle" fill="#65758a" font-size="19" font-weight="400"><tspan x="595" dy="0">实线：在线决策与状态反馈；虚线：离线拟合后的模型依赖。</tspan></text></g></svg>