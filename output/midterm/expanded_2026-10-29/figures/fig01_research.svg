<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">研究主线与历史工作的递进关系</title><desc id="desc">从AEIC过程记录到证据更新，再到预算下的集合价值协调。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#65758a" stroke-width="1.4"/></marker></defs><rect width="1200" height="580" fill="white"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="40" text-anchor="start" fill="#203047" font-size="26" font-weight="600"><tspan x="30" dy="0">研究递进与当前问题</tspan></text><rect x="30" y="95" width="350" height="155" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="205.0" y="134" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="205.0" dy="0">AEIC 过程表达</tspan></text><text x="205.0" y="173" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="205.0" dy="0">报告与资源行动</tspan><tspan x="205.0" dy="30.45">来源和推断可追溯</tspan></text><rect x="425" y="95" width="350" height="155" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="600.0" y="134" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="600.0" dy="0">证据驱动更新</tspan></text><text x="600.0" y="173" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="600.0" dy="0">定位决策相关主张</tspan><tspan x="600.0" dy="30.45">把核查落实到状态</tspan></text><rect x="820" y="95" width="350" height="155" rx="9" fill="#fbf5ed" stroke="#b87536" stroke-width="1.8"/><text x="995.0" y="134" text-anchor="middle" fill="#b87536" font-size="25" font-weight="600"><tspan x="995.0" dy="0">预算下博弈协调</tspan></text><text x="995.0" y="173" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="995.0" dy="0">考虑材料重复与互补</tspan><tspan x="995.0" dy="30.45">选择核查并重规划</tspan></text><path d="M380 172 H420" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M775 172 H815" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="310" width="1140" height="135" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="600.0" y="349" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="600.0" dy="0">统一研究问题</tspan></text><text x="600.0" y="388" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="600.0" dy="0">不同成员如何利用局部证据，在有限交流预算内形成更好的共同答案或排序？</tspan></text><path d="M205 250 V305" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="8 6"/><path d="M600 250 V305" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="8 6"/><path d="M995 250 V305" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="600" y="495" text-anchor="middle" fill="#203047" font-size="23" font-weight="400"><tspan x="600" dy="0">评价链条：信息有用 → 选择有效 → 更新准确 → 最终决策改善</tspan></text><text x="600" y="540" text-anchor="middle" fill="#65758a" font-size="19" font-weight="400"><tspan x="600" dy="0">三个阶段构成一条研究主线；排序器进步与博弈协调收益分别归因。</tspan></text></g></svg>