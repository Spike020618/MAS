<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">实验分组与机制收益归因设计</title><desc id="desc">大样本主比较与固定子集消融分开，强基线与独立评价对应机制主张。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#65758a" stroke-width="1.4"/></marker></defs><rect width="1200" height="710" fill="white"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="40" text-anchor="start" fill="#203047" font-size="26" font-weight="600"><tspan x="30" dy="0">实验设计与收益归因</tspan></text><rect x="30" y="90" width="330" height="130" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="195.0" y="129" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="195.0" dy="0">收益模型训练与校准</tspan></text><text x="195.0" y="168" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="195.0" dy="0">123 个原题或会话</tspan><tspan x="195.0" dy="30.45">固定分组与匹配四分支</tspan></text><rect x="420" y="90" width="750" height="130" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="795.0" y="129" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="795.0" dy="0">冻结后端到端比较</tspan></text><text x="795.0" y="168" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="795.0" dy="0">StrategyQA 200题 · ReDial 200会话 · HotpotQA 458题</tspan><tspan x="795.0" dy="30.45">核查诊断：Climate-FEVER 180条人工证据关系</tspan></text><path d="M360 155 H415" fill="none" stroke="#426b9a" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="30" y="285" width="1140" height="160" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="600.0" y="324" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="600.0" dy="0">同权限与同预算的主要对照</tspan></text><text x="600.0" y="363" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="600.0" dy="0">强单 Agent · 独立分工汇总 · 固定核查</tspan><tspan x="600.0" dy="30.45">集合边际贪心 · 中央同目标优化 · 边际贡献博弈</tspan></text><path d="M795 220 V280" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="505" width="350" height="120" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="205.0" y="544" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="205.0" dy="0">文献方法适配</tspan></text><text x="205.0" y="583" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="205.0" dy="0">独立采样投票</tspan><tspan x="205.0" dy="30.45">Self-Refine 与多 Agent 讨论</tspan></text><rect x="425" y="505" width="350" height="120" rx="9" fill="#fbf5ed" stroke="#b87536" stroke-width="1.8"/><text x="600.0" y="544" text-anchor="middle" fill="#b87536" font-size="25" font-weight="600"><tspan x="600.0" dy="0">固定 64 题次要分析</tspan></text><text x="600.0" y="583" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="600.0" dy="0">去交互 / 去重 / 重规划</tspan><tspan x="600.0" dy="30.45">联合行动 / 局部修改消融</tspan></text><rect x="820" y="505" width="350" height="120" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="995.0" y="544" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="995.0" dy="0">独立归因与评价</tspan></text><text x="995.0" y="583" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="995.0" dy="0">正确率、Recall、修正/损害</tspan><tspan x="995.0" dy="30.45">实际成本、偏离与迁移</tspan></text><path d="M200 445 V500" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M600 445 V500" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1000 445 V500" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><text x="600" y="675" text-anchor="middle" fill="#65758a" font-size="19" font-weight="400"><tspan x="600" dy="0">训练与评价按原题/会话隔离；先封存生成，再读标签；原论文分数不直接判胜负。</tspan></text></g></svg>