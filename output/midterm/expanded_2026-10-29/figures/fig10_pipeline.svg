<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">影视应用请求处理与门控流程</title><desc id="desc">规划、召回、审议与确定性约束分别承担明确责任。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#65758a" stroke-width="1.4"/></marker></defs><rect width="1200" height="590" fill="white"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="40" text-anchor="start" fill="#203047" font-size="26" font-weight="600"><tspan x="30" dy="0">应用请求与确定性边界</tspan></text><rect x="30" y="90" width="300" height="145" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="180.0" y="129" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="180.0" dy="0">结构化输入</tspan></text><text x="180.0" y="168" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="180.0" dy="0">自然语言、偏好与硬条件</tspan><tspan x="180.0" dy="30.45">Top-K 与时延预算</tspan></text><rect x="450" y="90" width="300" height="145" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="600.0" y="129" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="600.0" dy="0">请求时规划</tspan></text><text x="600.0" y="168" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="600.0" dy="0">透明启发式决定路径</tspan><tspan x="600.0" dy="30.45">保留计划和预算</tspan></text><rect x="870" y="90" width="300" height="145" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="1020.0" y="129" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="1020.0" dy="0">召回与冻结</tspan></text><text x="1020.0" y="168" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="1020.0" dy="0">目录过滤与相关性召回</tspan><tspan x="1020.0" dy="30.45">固定原生候选集合</tspan></text><rect x="870" y="330" width="300" height="145" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="1020.0" y="369" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="1020.0" dy="0">并行角色审议</tspan></text><text x="1020.0" y="408" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="1020.0" dy="0">同候选覆盖、同轮快照</tspan><tspan x="1020.0" dy="30.45">依据与分歧分别保存</tspan></text><rect x="450" y="330" width="300" height="145" rx="9" fill="#fbf5ed" stroke="#b87536" stroke-width="1.8"/><text x="600.0" y="369" text-anchor="middle" fill="#b87536" font-size="25" font-weight="600"><tspan x="600.0" dy="0">确定性门控</tspan></text><text x="600.0" y="408" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="600.0" dy="0">年份 / 类型 / 排除ID</tspan><tspan x="600.0" dy="30.45">硬约束不由投票放宽</tspan></text><rect x="30" y="330" width="300" height="145" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="180.0" y="369" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="180.0" dy="0">共同排序与展示</tspan></text><text x="180.0" y="408" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="180.0" dy="0">结果、理由与未决分歧</tspan><tspan x="180.0" dy="30.45">归档执行与资源</tspan></text><path d="M330 162 H445" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M750 162 H865" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1020 235 V325" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M870 402 H755" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M450 402 H335" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><text x="600" y="550" text-anchor="middle" fill="#65758a" font-size="19" font-weight="400"><tspan x="600" dy="0">研究核查策略后续接入角色与决策之间；当前图展示已实现的应用主流程。</tspan></text></g></svg>