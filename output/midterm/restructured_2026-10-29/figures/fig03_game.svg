<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">集合价值估计与边际贡献博弈</title><desc id="desc">单份和联合匹配观测形成价值模型，成员通过可行单边改进协调资源。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#65758a" stroke-width="1.4"/></marker></defs><rect width="1200" height="650" fill="white"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="40" text-anchor="start" fill="#203047" font-size="26" font-weight="600"><tspan x="30" dy="0">集合价值与资源协调</tspan></text><rect x="30" y="90" width="310" height="180" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="185.0" y="129" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="185.0" dy="0">匹配观测</tspan></text><text x="185.0" y="168" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="185.0" dy="0">空集：旧资料再思考</tspan><tspan x="185.0" dy="30.45">单份：A 或 B</tspan><tspan x="185.0" dy="30.45">联合：A 与 B</tspan></text><rect x="400" y="90" width="350" height="180" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="575.0" y="129" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="575.0" dy="0">学习条件价值</tspan></text><text x="575.0" y="168" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="575.0" dy="0">g(A) = Q(A) − Q(∅)</tspan><tspan x="575.0" dy="30.45">h(A,B) = Q(AB) − Q(A)</tspan><tspan x="575.0" dy="30.45">− Q(B) + Q(∅)</tspan></text><rect x="810" y="90" width="360" height="180" rx="9" fill="#fbf5ed" stroke="#b87536" stroke-width="1.8"/><text x="990.0" y="129" text-anchor="middle" fill="#b87536" font-size="25" font-weight="600"><tspan x="990.0" dy="0">协调核查行动</tspan></text><text x="990.0" y="168" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="990.0" dy="0">每名成员选单份、联合或停止</tspan><tspan x="990.0" dy="30.45">信息按证据并集计值</tspan><tspan x="990.0" dy="30.45">调用与实际成本分别记录</tspan></text><path d="M340 180 H395" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M750 180 H805" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="330" width="1140" height="130" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="600.0" y="369" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="600.0" dy="0">共同潜势与成员效用</tspan></text><text x="600.0" y="408" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="600.0" dy="0">Φ(a) = 预计集合收益 − 预计执行成本；uᵢ(a) = Φ(a) − Φ(a₋ᵢ, ∅)</tspan></text><path d="M990 270 V325" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><text x="600" y="515" text-anchor="middle" fill="#203047" font-size="24" font-weight="400"><tspan x="600" dy="0">固定状态：可行单边改进 → 无有利偏离 → 执行一个核查行动</tspan></text><text x="600" y="565" text-anchor="middle" fill="#203047" font-size="22" font-weight="400"><tspan x="600" dy="0">状态变化：重新构造价值与博弈；有限预算控制整轮终止</tspan></text><text x="600" y="610" text-anchor="middle" fill="#65758a" font-size="19" font-weight="400"><tspan x="600" dy="0">均衡只针对预计目标；中央同目标最优与真实任务质量均需另外比较。</tspan></text></g></svg>