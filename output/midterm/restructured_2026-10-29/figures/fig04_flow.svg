<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">在线证据核查与状态更新流程</title><desc id="desc">追加核查受预算约束；无效输出保留旧状态；每次更新后重新规划。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#65758a" stroke-width="1.4"/></marker></defs><rect width="1200" height="660" fill="white"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="40" text-anchor="start" fill="#203047" font-size="26" font-weight="600"><tspan x="30" dy="0">在线核查与更新流程</tspan></text><rect x="35" y="85" width="300" height="120" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="185.0" y="124" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="185.0" dy="0">初始分工与汇总</tspan></text><text x="185.0" y="163" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="185.0" dy="0">形成主张、状态与初始决策</tspan></text><rect x="450" y="85" width="300" height="120" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="600.0" y="124" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="600.0" dy="0">选择一个活动疑点</tspan></text><text x="600.0" y="163" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="600.0" dy="0">固定目标；生成单份/联合动作</tspan></text><rect x="865" y="85" width="300" height="120" rx="9" fill="#fbf5ed" stroke="#b87536" stroke-width="1.8"/><text x="1015.0" y="124" text-anchor="middle" fill="#b87536" font-size="25" font-weight="600"><tspan x="1015.0" dy="0">估值并求解分配</tspan></text><text x="1015.0" y="163" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="1015.0" dy="0">博弈、中央或贪心</tspan></text><path d="M335 145 H445" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M750 145 H860" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="865" y="290" width="300" height="130" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="1015.0" y="329" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="1015.0" dy="0">执行指定成员核查</tspan></text><text x="1015.0" y="368" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="1015.0" dy="0">返回判断、片段ID与局部补丁</tspan></text><path d="M1015 205 V285" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="450" y="290" width="300" height="130" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="600.0" y="329" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="600.0" dy="0">程序校验</tspan></text><text x="600.0" y="368" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="600.0" dy="0">来源可见、目标匹配</tspan><tspan x="600.0" dy="30.45">原生ID与修改范围合法</tspan></text><path d="M865 355 H755" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="35" y="280" width="300" height="150" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="185.0" y="319" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="185.0" dy="0">按合法结果提交</tspan></text><text x="185.0" y="358" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="185.0" dy="0">接受补丁或记录未决</tspan><tspan x="185.0" dy="30.45">非法输出保持旧决策</tspan><tspan x="185.0" dy="30.45">保存前后状态与费用</tspan></text><path d="M450 355 H340" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="35" y="510" width="300" height="110" rx="9" fill="#fbf5ed" stroke="#b87536" stroke-width="1.8"/><text x="185.0" y="549" text-anchor="middle" fill="#b87536" font-size="25" font-weight="600"><tspan x="185.0" dy="0">是否仍有合法行动</tspan></text><text x="185.0" y="588" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="185.0" dy="0">且预算尚未耗尽？</tspan></text><path d="M185 430 V505" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M35 565 H15 V245 H600 V210" fill="none" stroke="#32827b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="300" y="245" text-anchor="middle" fill="#65758a" font-size="19" font-weight="400"><tspan x="300" dy="0">是：新状态重新规划</tspan></text><rect x="540" y="510" width="625" height="110" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="852.5" y="549" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="852.5" dy="0">共同答案或共同排序</tspan></text><text x="852.5" y="588" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="852.5" dy="0">保留未决分歧；生成完成后再读取标签评分</tspan></text><path d="M335 565 H535" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><text x="420" y="540" text-anchor="middle" fill="#65758a" font-size="19" font-weight="400"><tspan x="420" dy="0">否</tspan></text></g></svg>