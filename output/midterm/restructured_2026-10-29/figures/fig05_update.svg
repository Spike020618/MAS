<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">有依据的局部更新及失败处理</title><desc id="desc">核查仅作用于指定目标，受限操作保护无关状态；语义可靠性另行评价。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#65758a" stroke-width="1.4"/></marker></defs><rect width="1200" height="660" fill="white"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="30" y="40" text-anchor="start" fill="#203047" font-size="26" font-weight="600"><tspan x="30" dy="0">受限更新与事务边界</tspan></text><rect x="30" y="95" width="310" height="230" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="185.0" y="134" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="185.0" dy="0">更新前公共状态</tspan></text><text x="185.0" y="173" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="185.0" dy="0">活动主张 c₁、c₂、c₃</tspan><tspan x="185.0" dy="30.45">当前原生答案或 Top10</tspan><tspan x="185.0" dy="30.45">状态版本 v</tspan></text><rect x="445" y="95" width="310" height="230" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="600.0" y="134" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="600.0" dy="0">对 c₂ 的核查结果</tspan></text><text x="600.0" y="173" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="600.0" dy="0">支持 / 反驳 / 证据不足</tspan><tspan x="600.0" dy="30.45">可见原文片段ID与理由</tspan><tspan x="600.0" dy="30.45">范围内补丁或 null</tspan></text><rect x="860" y="95" width="310" height="230" rx="9" fill="#eef7f5" stroke="#32827b" stroke-width="1.8"/><text x="1015.0" y="134" text-anchor="middle" fill="#32827b" font-size="25" font-weight="600"><tspan x="1015.0" dy="0">提交后的公共状态</tspan></text><text x="1015.0" y="173" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="1015.0" dy="0">保存 c₂ 的模型判断</tspan><tspan x="1015.0" dy="30.45">只应用允许的局部修改</tspan><tspan x="1015.0" dy="30.45">不改写 c₁、c₃ 原文</tspan></text><path d="M340 205 H440" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M755 205 H855" fill="none" stroke="#65758a" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="390" width="540" height="135" rx="9" fill="#eff4fa" stroke="#426b9a" stroke-width="1.8"/><text x="300.0" y="429" text-anchor="middle" fill="#426b9a" font-size="25" font-weight="600"><tspan x="300.0" dy="0">允许的决策操作</tspan></text><text x="300.0" y="468" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="300.0" dy="0">问答：设置一个原生答案选项</tspan><tspan x="300.0" dy="30.45">推荐：交换 Top10 内外各一个候选</tspan></text><rect x="630" y="390" width="540" height="135" rx="9" fill="#fbf5ed" stroke="#b87536" stroke-width="1.8"/><text x="900.0" y="429" text-anchor="middle" fill="#b87536" font-size="25" font-weight="600"><tspan x="900.0" dy="0">失败与不确定性</tspan></text><text x="900.0" y="468" text-anchor="middle" fill="#203047" font-size="21" font-weight="400"><tspan x="900.0" dy="0">合同失败：旧状态保留并记录响应</tspan><tspan x="900.0" dy="30.45">证据不足：允许未决；不强行纠正</tspan></text><text x="600" y="585" text-anchor="middle" fill="#203047" font-size="25" font-weight="400"><tspan x="600" dy="0">结构与来源校验 ≠ 语义真实性认证</tspan></text><text x="600" y="625" text-anchor="middle" fill="#65758a" font-size="19" font-weight="400"><tspan x="600" dy="0">语义质量通过公开人工标签及任务结果独立评价；该图为操作范围示意。</tspan></text></g></svg>